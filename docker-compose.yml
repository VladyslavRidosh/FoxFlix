services:
  postgres:
    image: postgres:17-alpine
    container_name: foxflix-postgres
    environment:
      POSTGRES_DB: foxflix
      POSTGRES_USER: foxflix_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxflix_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - foxflix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxflix_user -d foxflix"]
      interval: 5s
      timeout: 5s
      retries: 20

  foxflix-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: foxflix-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=foxflix;Username=foxflix_user;Password=${POSTGRES_PASSWORD:-foxflix_dev_password}
      TMDB__ReadAccessToken: ${TMDB_READ_ACCESS_TOKEN:-}
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - foxflix-media-storage:/app/MediaStorage
    depends_on:
      postgres:
        condition: service_healthy

  foxflix-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: foxflix-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://foxflix-api:8080/
      ApiSettings__PublicBaseUrl: http://localhost:8081/
    depends_on:
      - foxflix-api

volumes:
  foxflix-postgres-data:
  foxflix-media-storage:
